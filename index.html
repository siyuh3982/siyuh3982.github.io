<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>胡思雨 | 个人主页</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-a" aria-hidden="true"></div>
    <div class="bg-orb orb-b" aria-hidden="true"></div>

    <header class="hero">
      <div class="hero-card">
        <p class="eyebrow">Personal Profile</p>
        <h1 id="name">姓名</h1>
        <p class="subtitle">
          <span id="major">专业</span> · <span id="school">学校</span>
        </p>
        <div class="meta">
          <span class="chip">年龄：<span id="age">20</span> 岁</span>
          <span class="chip">方向：语言与表达</span>
        </div>
      </div>
    </header>

    <main class="grid">
      <section class="card">
        <h2>个人信息</h2>
        <ul id="profile-list" class="list"></ul>
      </section>

      <section class="card">
        <h2>兴趣爱好</h2>
        <div id="hobbies" class="tags"></div>
      </section>

      <section class="card">
        <h2>一句话介绍</h2>
        <p id="bio" class="bio"></p>
      </section>

      <section class="card">
        <h2>联系我</h2>
        <div id="contacts" class="contacts"></div>
      </section>
    </main>

    <footer class="footer">
      <span id="footer-text">© 2026 Personal Page</span>
    </footer>

    <script src="app.js" defer></script>
  </body>
</html>
